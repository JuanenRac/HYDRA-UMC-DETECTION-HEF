<title id="t">HYDRA-UMC-DETECTION-HEF architecture</title>
<desc id="d">HYDRA-UMC-DETECTION-HEF keeps the registry of compiled .hef models: a name, a version, a task, an input shape, the classes and a SHA-256, validated against a schema. A load gate checks the checksum of the file and the Hailo architecture before a model may be loaded. The toolchain that compiles a model (ONNX export, the Hailo Dataflow Compiler, quantisation) is not part of this repository and needs the Hailo SDK on the CM5.</desc>
